<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Mundo de Bloques</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#fff;background:#101e24}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#81c8fa 0 42%,#81c8fa 42%,#8dcf70 42% 100%);min-height:100vh}header{background:#182e2a;padding:22px;text-align:center;border-bottom:6px solid #467b39}h1{margin:0;font-size:clamp(27px,5vw,46px);text-shadow:3px 4px #1c2a21}header p{margin:8px 0 0;color:#deeddf}.wrap{max-width:950px;margin:26px auto;padding:0 18px}.panel{background:#172b2bea;border:3px solid #436b4b;padding:18px;border-radius:12px;box-shadow:0 12px 25px #14331245}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:13px 0}.tool,button{cursor:pointer;background:#284738;color:white;border:2px solid #698768;border-radius:7px;padding:10px 13px;font-weight:700}.tool.selected{outline:3px solid #ffe076;background:#467b38}.tool:hover,button:hover{filter:brightness(1.2)}.grid{display:grid;grid-template-columns:repeat(16,1fr);border:5px solid #31543a;background:#9cd4fe;touch-action:manipulation}.cell{aspect-ratio:1;border:1px solid #ffffff34;cursor:pointer;position:relative}.cell:hover{outline:2px solid #fff;z-index:1}.grass{background:linear-gradient(#48a52b 0 24%,#95673e 25%);box-shadow:inset -5px -4px #0002}.dirt{background:#986b40;box-shadow:inset 5px 5px #bc8b55,inset -5px -5px #634320}.stone{background:linear-gradient(130deg,#98999c,#67696d);box-shadow:inset 6px 4px #c5c5c5,inset -5px -6px #525456}.wood{background:repeating-linear-gradient(90deg,#96602c 0 7px,#b27a40 7px 15px)}.water{background:linear-gradient(125deg,#26c4ed,#1762bc);box-shadow:inset 0 4px #83e5fb}.leaves{background:radial-gradient(#75c744 10%,#357b2c 80%)}.sand{background:#e8d388;box-shadow:inset 4px 4px #fff2b3,inset -4px -3px #bda86a}.tip{color:#d7ead9;font-size:14px;line-height:1.5}footer{text-align:center;padding:20px;color:#203b24;font-weight:bold}
</style></head><body><header><h1>⛏️ Mini Mundo de Bloques</h1><p>Construye tu propio paisaje, bloque a bloque</p></header><main class="wrap"><section class="panel"><h2>🎨 Elige un bloque</h2><div class="toolbar" id="tools"></div><div class="toolbar"><button id="clear">🧹 Limpiar</button><button id="preset">🌲 Crear paisaje</button><button id="save">💾 Guardar</button></div><div class="grid" id="grid" aria-label="Tablero para construir"></div><p class="tip">Haz clic o desliza el dedo sobre las casillas para colocar bloques. Tu mundo se guarda en este navegador. Proyecto de aficionados, no oficial.</p></section></main><footer>¡Deja volar tu creatividad! 🌄</footer><script>
const types=[['grass','🌱 Césped'],['dirt','🟫 Tierra'],['stone','🪨 Piedra'],['wood','🪵 Madera'],['leaves','🌿 Hojas'],['water','💧 Agua'],['sand','🏖️ Arena'],['','🧽 Borrar']];let current='grass';const size=16*10;const grid=document.querySelector('#grid');let cells=JSON.parse(localStorage.getItem('mundo-bloques')||'null');if(!Array.isArray(cells)||cells.length!==size)cells=Array(size).fill('');function render(){grid.innerHTML='';cells.forEach((type,i)=>{let el=document.createElement('div');el.className='cell '+type;el.title='Casilla '+(i+1);el.dataset.i=i;grid.append(el)})}function paint(i){cells[i]=current;grid.children[i].className='cell '+current}let pressed=false;grid.addEventListener('pointerdown',e=>{if(e.target.dataset.i!==undefined){pressed=true;paint(+e.target.dataset.i);grid.setPointerCapture(e.pointerId)}});grid.addEventListener('pointermove',e=>{if(!pressed)return;let el=document.elementFromPoint(e.clientX,e.clientY);if(el?.dataset.i!==undefined)paint(+el.dataset.i)});window.addEventListener('pointerup',()=>pressed=false);types.forEach(([type,label])=>{let btn=document.createElement('button');btn.className='tool '+(current===type?'selected':'');btn.textContent=label;btn.onclick=()=>{current=type;document.querySelectorAll('.tool').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected')};document.querySelector('#tools').append(btn)});document.querySelector('#save').onclick=()=>{localStorage.setItem('mundo-bloques',JSON.stringify(cells));alert('¡Mundo guardado!')};document.querySelector('#clear').onclick=()=>{cells.fill('');render();localStorage.removeItem('mundo-bloques')};document.querySelector('#preset').onclick=()=>{cells=Array.from({length:size},(_,i)=>{let x=i%16,y=Math.floor(i/16);if(y>7)return 'dirt';if(y===7)return 'grass';if(x===5&&y>=3&&y<=6)return 'wood';if(x>=3&&x<=7&&y>=1&&y<=3)return 'leaves';if(x>=11&&y===6)return 'water';return ''});render()};render();
</script></body></html>
